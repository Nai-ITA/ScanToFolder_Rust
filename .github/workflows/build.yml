name: build

# Compila Scan to Folder per Windows (.exe + installer), Linux (.deb, AppImage)
# e macOS (.dmg universale). Si avvia a mano (Actions -> build -> Run workflow)
# o con un tag tipo v2.0.0 (in quel caso crea anche una Release con i file).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: "--bundles nsis"
            out: |
              src-tauri/target/release/ScanToFolder.exe
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            name: linux
            args: "--bundles deb,appimage"
            out: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            name: macos
            args: "--target universal-apple-darwin --bundles dmg"
            out: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dipendenze Linux
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev build-essential patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        if: matrix.name == 'linux'
        working-directory: src-tauri
        run: cargo test
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        working-directory: src-tauri
        run: cargo tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ScanToFolder-${{ matrix.name }}
          path: ${{ matrix.out }}
      - name: Release (solo con un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.out }}
