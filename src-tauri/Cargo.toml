[package]
name = "scan_to_folder"
version = "2.0.0"
edition = "2021"
description = "Scan to Folder: configura cartella condivisa SMB e FTP per le scansioni (Windows, Linux, macOS)"

[[bin]]
name = "ScanToFolder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libunftp = { version = "0.23.1", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4.0"
unftp-core = "0.1.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
